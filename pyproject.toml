[project]
name = "wildfire-risk-uncertainty"
version = "0.1.0"
description = "Research software for probabilistic wildfire risk prediction and uncertainty quantification."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyarrow>=23,<24",
    "pyogrio>=0.13.0",
    "pyproj>=3.7,<4",
    "rasterio>=1.5.2",
    "scikit-gstat>=1.0.24",
    "scikit-learn>=1.9,<2",
    "scipy>=1.16,<2",
    "shapely>=2.1,<3",
    "tqdm>=4.67,<5",
    "torch==2.13.0",
    "optuna==5.0.0",
    "wandb==0.30.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
wildfire-eda = "wildfire_risk_uncertainty.eda.cli:main"
wildfire-create-dataset = "wildfire_risk_uncertainty.dataset.create_dataset:main"
wildfire-validate-pilot = "wildfire_risk_uncertainty.dataset.validate_pilot:main"
wildfire-spatial-dependence = "wildfire_risk_uncertainty.spatial_validation.cli:main"
wildfire-spatial-folds = "wildfire_risk_uncertainty.spatial_validation.outer_cli:main"
wildfire-validate-folds = "wildfire_risk_uncertainty.spatial_validation.validate_folds:main"
wildfire-reproduce-folds = "wildfire_risk_uncertainty.spatial_validation.reproduce_folds:main"
wildfire-reproduce-fold-reports = "wildfire_risk_uncertainty.spatial_validation.reproduce_reports:main"
wildfire-training-benchmark = "wildfire_risk_uncertainty.benchmark.cli:main"
wildfire-train-validate = "wildfire_risk_uncertainty.training.cli:main"
wildfire-hpo = "wildfire_risk_uncertainty.hpo.cli:main"
wildfire-inner-folds = "wildfire_risk_uncertainty.spatial_validation.inner_cli:main"
wildfire-training-cache = "wildfire_risk_uncertainty.training.cache_cli:main"
wildfire-validate-inner-folds = "wildfire_risk_uncertainty.spatial_validation.validate_inner_folds:main"
